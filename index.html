<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple to-do list with local storage.">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-labelledby="title">
    <header class="app-header">
      <div>
        <p class="eyebrow">Stay organized</p>
        <h1 id="title">My To-Do List</h1>
      </div>
      <span id="taskCount" class="task-count">0 tasks</span>
    </header>

    <form id="todoForm" class="todo-form">
      <label class="sr-only" for="todoInput">Add a task</label>
      <input id="todoInput" type="text" maxlength="120" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit">Add task</button>
    </form>

    <div class="toolbar" aria-label="Task filters">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="active">Active</button>
        <button class="filter" type="button" data-filter="completed">Completed</button>
      </div>
      <button id="clearCompleted" class="text-button" type="button">Clear completed</button>
    </div>

    <ul id="todoList" class="todo-list" aria-live="polite"></ul>
    <p id="emptyState" class="empty-state">No tasks yet. Add one above!</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
