<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"/>
</head>
<body>
  <div class="container">
    <h2>Currency Converter</h2>
    <form>
      <div class="amount">
        <p>Enter Amount</p>
        <input id="amount" value="1" type="text" />
      </div>
      <div class="dropdown">
        <div class="from">
          <p>From</p>
          <div class="select-container">
            <img id="fromFlag" src="https://flagsapi.com/US/flat/64.png">
            <select id="from" name="from"></select>
          </div>
        </div>
        <i class="fa-solid fa-right-left"></i>
        <div class="to">
          <p>To</p>
          <div class="select-container">
            <img id="toFlag" src="https://flagsapi.com/IN/flat/64.png">
            <select id="to" name="to"></select>
          </div>
        </div>
      </div>
      <div class="msg" id="msg">1 USD = 80 INR</div>
        <button type="button">Get Exchange Rate</button>
    </form>
  </div>
  <script src="codes.js"></script>
  <script src="app.js"></script>
</body>
</html>
